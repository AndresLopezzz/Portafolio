<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andres Felipe Lopez Cabrera - Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-top">
          <h1 id="name" class="name"></h1>
          <button
            id="downloadPdf"
            class="download-btn"
            title="Descargar CV en PDF"
          >
            <span class="download-icon">📄</span>
            <span class="download-text">Descargar PDF</span>
          </button>
        </div>
        <div id="contact" class="contact"></div>
      </header>

      <section class="section">
        <h2 class="section-title">PROFESSIONAL PROFILE</h2>
        <p id="profile" class="profile-text"></p>
      </section>

      <section class="section">
        <h2 class="section-title">EDUCATION</h2>
        <div id="education" class="education-list"></div>
      </section>

      <section class="section">
        <h2 class="section-title">PROFESSIONAL EXPERIENCE</h2>
        <div id="experience" class="experience-list"></div>
      </section>

      <section class="section">
        <h2 class="section-title">TECHNICAL SKILLS</h2>
        <div id="skills" class="skills-container"></div>
      </section>

      <section class="section">
        <h2 class="section-title">PROJECTS</h2>
        <div id="projects" class="projects-list"></div>
      </section>

      <section class="section">
        <h2 class="section-title">PROGRAMS</h2>
        <div id="programs" class="programs-list"></div>
      </section>

      <section class="section">
        <h2 class="section-title">LANGUAGES</h2>
        <div id="languages" class="languages-list"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
